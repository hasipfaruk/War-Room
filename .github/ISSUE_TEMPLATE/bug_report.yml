name: Bug report
description: Something in War Room isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security problem, don't open a public issue; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pnpm dev
        2. Deploy the "Pool leak" scenario
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Server output or error
      description: Paste the terminal output from `pnpm dev` or `pnpm start`. Remove any API keys first.
      render: shell
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Demo mode (no API key)
        - Live mode
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.20.0
    validations:
      required: true
